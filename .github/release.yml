changelog:
  categories:
    - title: "✨ Neue Funktionen"
      labels:
        - "feature"
    - title: "🔧 Verbesserungen"
      labels:
        - "enhancement"
    - title: "🐛 Fehlerbehebungen"
      labels:
        - "fix"
    - title: "🔒 Sicherheit"
      labels:
        - "security"
    - title: "⚙️ Technische Änderungen"
      labels:
        - "documentation"
        - "refactor"
        - "dependencies"
  exclude:
    labels:
      - "skip-changelog"
    authors:
      - "dependabot[bot]"
