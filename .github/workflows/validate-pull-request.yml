name: Validate Pull Request Description

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  validate-description:
    name: Validate PR template
    runs-on: ubuntu-latest
    steps:
      - name: Check required PR information
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const lines = body.split(/\r?\n/);
            const errors = [];

            function section(title) {
              const heading = '## ' + title;
              const start = lines.findIndex(line => line.trim() === heading);
              if (start === -1) return '';
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith('## ')) {
                  end = i;
                  break;
                }
              }
              return lines.slice(start + 1, end).join('\n').trim();
            }

            function clean(value) {
              return value
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/\[[^\]]*\]/g, '')
                .replace(/\s/g, '');
            }

            const description = section('📝 Beschreibung');
            if (!clean(description)) {
              errors.push('Die **Beschreibung** fehlt oder enthält nur den Platzhalter.');
            }

            const category = section('🏷️ Release-Kategorie');
            const selectedCategories = category.match(/^- \[x\] /gim) || [];
            if (selectedCategories.length !== 1) {
              errors.push('Wähle genau eine **Release-Kategorie** aus.');
            }

            const allowedLabels = new Set([
              'feature', 'enhancement', 'fix', 'security',
              'documentation', 'refactor', 'dependencies', 'skip-changelog'
            ]);
            const labels = pr.labels.map(label => label.name.toLowerCase());
            const categoryLine = category.split(/\r?\n/).find(line => /^- \[x\] /.test(line));
            const categoryLabelMatch = categoryLine && categoryLine.match(/`([a-z-]+)`/);
            const selectedLabel = categoryLabelMatch ? categoryLabelMatch[1] : '';
            const selectedAllowedLabels = labels.filter(label => allowedLabels.has(label));

            if (selectedAllowedLabels.length !== 1) {
              errors.push('Setze genau ein passendes GitHub-Label: feature, enhancement, fix, security, documentation, refactor, dependencies oder skip-changelog.');
            } else if (selectedLabel && !labels.includes(selectedLabel)) {
              errors.push('Das ausgewählte Release-Kategorie-Label (' + selectedLabel + ') fehlt am Pull Request.');
            } else if (selectedLabel && selectedAllowedLabels[0] !== selectedLabel) {
              errors.push('Das ausgewählte Release-Kategorie-Label muss mit dem einzigen Release-Kategorie-Label des Pull Requests übereinstimmen.');
            }

            const releaseSection = section('📣 Release-Zusammenfassung');
            const releaseChoices = releaseSection.match(/^- \[x\] /gim) || [];
            const includeRelease = /^- \[x\] In Release aufnehmen$/im.test(releaseSection);
            const excludeRelease = /^- \[x\] Nicht aufnehmen$/im.test(releaseSection);

            if (releaseChoices.length !== 1 || includeRelease === excludeRelease) {
              errors.push('Wähle genau eine Option für die **Release-Zusammenfassung** aus.');
            }

            if (includeRelease) {
              const summaryMatch = releaseSection.match(/\*\*Zusammenfassung für Benutzer:\*\*\s*([\s\S]*)/i);
              const summary = summaryMatch
                ? summaryMatch[1].replace(/<!--[\s\S]*?-->/g, '').trim()
                : '';
              const normalizedSummary = summary.replace(/^\[[^\]]*\]$/, '').trim();
              if (!normalizedSummary || normalizedSummary.length > 500) {
                errors.push('Für aufgenommene Änderungen ist eine verständliche Release-Zusammenfassung mit maximal 500 Zeichen erforderlich.');
              }
              if (selectedLabel === 'skip-changelog') {
                errors.push('Bei der Kategorie skip-changelog muss "Nicht aufnehmen" ausgewählt werden.');
              }
            }

            if (excludeRelease && selectedLabel !== 'skip-changelog') {
              errors.push('Wenn die Änderung nicht in Release Notes erscheinen soll, wähle die Kategorie skip-changelog und setze das entsprechende Label.');
            }

            const changeType = section('🛠️ Art der Änderung');
            if (!/^- \[x\] /im.test(changeType)) {
              errors.push('Wähle mindestens eine **Art der Änderung** aus.');
            }

            const components = section('📂 Geänderte / Hinzugefügte Komponenten');
            if (!clean(components)) {
              errors.push('Nenne die **geänderten Komponenten/Dateien**.');
            }

            const tests = section('🧪 Testen & Überprüfung');
            const testChecks = (tests.match(/^- \[x\] /gim) || []).length;
            const limitationMatch = tests.match(/\*\*Nicht ausgeführt \/ Einschränkungen und ggf\. andere Prüfungen:\*\*([\s\S]*)/);
            const limitationText = limitationMatch ? clean(limitationMatch[1]) : '';
            if (testChecks === 0 && !limitationText) {
              errors.push('Kreuze mindestens eine tatsächlich ausgeführte Prüfung an oder erläutere, warum keine Prüfung möglich war.');
            }

            const security = section('🔒 Sicherheit & Konfiguration');
            if (!/^- \[x\] Ich habe den Git-Diff auf Secrets/im.test(security)) {
              errors.push('Bestätige die Prüfung des Git-Diffs auf Secrets, Passwörter, Tokens und API-Keys.');
            }

            const screenshots = section('📷 Screenshots oder Demo');
            if (!clean(screenshots)) {
              errors.push('Bei UI-Änderungen Screenshots/Demo ergänzen; sonst ausdrücklich "Nicht relevant" eintragen.');
            }

            if (errors.length) {
              core.setFailed(
                'Der Pull Request ist noch nicht vollständig beschrieben:\n\n' +
                errors.map(error => '- ' + error).join('\n') +
                '\n\nBitte ergänze die PR-Beschreibung anhand der Vorlage und speichere sie erneut.'
              );
            } else {
              core.info('PR description contains all required information.');
            }
