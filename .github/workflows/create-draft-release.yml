name: Create Draft Release Notes

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Neuer Release-Tag (z. B. v0.4.0)"
        required: true
        type: string
      previous_tag_name:
        description: "Vorheriger Release-Tag als Startpunkt (z. B. v0.3.0)"
        required: true
        type: string
      release_name:
        description: "Anzeigename des Releases (optional; standardmäßig der Tag)"
        required: false
        type: string
      target_commitish:
        description: "Zielbranch oder Commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  create-draft:
    name: Build curated release draft
    runs-on: ubuntu-latest
    steps:
      - name: Collect approved PR release summaries and create draft
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = core.getInput('tag_name', { required: true }).trim();
            const previousTag = core.getInput('previous_tag_name', { required: true }).trim();
            const target = core.getInput('target_commitish', { required: true }).trim();
            const releaseName = core.getInput('release_name').trim() || tagName;

            if (tagName === previousTag) {
              core.setFailed('Neuer und vorheriger Release-Tag dürfen nicht identisch sein.');
              return;
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              core.setFailed('Für diesen Tag existiert bereits ein Release. Bitte einen neuen Tag verwenden.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const comparison = await github.paginate(
              github.rest.repos.compareCommitsWithBasehead,
              {
                owner,
                repo,
                basehead: previousTag + '...' + target,
                per_page: 100
              }
            );
            const includedCommitShas = new Set(comparison.map(commit => commit.sha.toLowerCase()));

            if (includedCommitShas.size === 0) {
              core.setFailed('Zwischen vorherigem Tag und Zielbranch wurden keine Commits gefunden.');
              return;
            }

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base: target,
              per_page: 100
            });

            const sections = [
              { key: 'feature', title: '✨ Neue Funktionen', entries: [] },
              { key: 'enhancement', title: '🔧 Verbesserungen', entries: [] },
              { key: 'fix', title: '🐛 Fehlerbehebungen', entries: [] },
              { key: 'security', title: '🔒 Sicherheit', entries: [] },
              { key: 'technical', title: '⚙️ Technische Änderungen', entries: [] }
            ];

            const categoryByLabel = {
              feature: 'feature',
              enhancement: 'enhancement',
              fix: 'fix',
              security: 'security',
              documentation: 'technical',
              refactor: 'technical',
              dependencies: 'technical'
            };

            const skipped = [];
            const eligible = pullRequests.filter(pr =>
              pr.merged_at &&
              pr.merge_commit_sha &&
              includedCommitShas.has(pr.merge_commit_sha.toLowerCase())
            );

            for (const pr of eligible) {
              const labels = (pr.labels || []).map(label => label.name.toLowerCase());
              if (labels.includes('skip-changelog')) {
                skipped.push('#' + pr.number + ' (skip-changelog)');
                continue;
              }

              const lines = (pr.body || '').split(/\r?\n/);
              const start = lines.findIndex(line => line.trim() === '## 📣 Release-Zusammenfassung');
              if (start === -1) {
                skipped.push('#' + pr.number + ' (keine Release-Zusammenfassung; vermutlich vor Einführung der Vorlage erstellt)');
                continue;
              }

              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith('## ')) {
                  end = i;
                  break;
                }
              }
              const releaseSection = lines.slice(start + 1, end);
              const sectionText = releaseSection.join('\n');

              if (!/^- \[x\] In Release aufnehmen$/im.test(sectionText)) {
                skipped.push('#' + pr.number + ' (nicht zur Aufnahme markiert)');
                continue;
              }

              const summaryMarker = releaseSection.findIndex(line =>
                line.trim() === '**Zusammenfassung für Benutzer:**'
              );
              if (summaryMarker === -1) {
                skipped.push('#' + pr.number + ' (Zusammenfassung fehlt)');
                continue;
              }

              const summaryLines = [];
              for (const line of releaseSection.slice(summaryMarker + 1)) {
                if (/^\*\*[^*].*\*\*$/.test(line.trim())) break;
                summaryLines.push(line);
              }
              const summary = summaryLines
                .join('\n')
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/^\[[^\]]*\]$/gm, '')
                .trim();

              if (!summary || summary.length > 500) {
                skipped.push('#' + pr.number + ' (Zusammenfassung leer oder zu lang)');
                continue;
              }

              const selectedCategory = labels
                .map(label => categoryByLabel[label])
                .find(Boolean);

              if (!selectedCategory) {
                skipped.push('#' + pr.number + ' (kein gültiges Release-Kategorie-Label)');
                continue;
              }

              const category = sections.find(item => item.key === selectedCategory);
              category.entries.push(summary.replace(/\n+/g, ' ').trim());
            }

            const populatedSections = sections.filter(section => section.entries.length > 0);
            if (populatedSections.length === 0) {
              core.setFailed('Es wurden keine gültigen Release-Zusammenfassungen gefunden. Bitte PR-Vorlagen und Labels prüfen.');
              return;
            }

            const totalEntries = populatedSections.reduce((sum, section) => sum + section.entries.length, 0);
            const categoryNames = populatedSections.map(section => section.title.replace(/^\S+\s*/, ''));
            const body = [
              '## Überblick',
              'Dieses Update enthält ' + totalEntries + ' dokumentierte Änderung(en): ' + categoryNames.join(', ') + '.',
              '',
              ...populatedSections.flatMap(section => [
                '## ' + section.title,
                ...section.entries.map(entry => '- ' + entry),
                ''
              ]),
              '---',
              '**Vollständiger technischer Änderungsverlauf:** https://github.com/' + owner + '/' + repo + '/compare/' + previousTag + '...' + target
            ].join('\n').trim();

            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tagName,
              target_commitish: target,
              name: releaseName,
              body,
              draft: true,
              prerelease: false,
              generate_release_notes: false
            });

            core.info('Draft release created: ' + created.data.html_url);
            core.info('Included release summaries: ' + totalEntries);
            core.info('Skipped merged PRs: ' + skipped.length);
            for (const item of skipped) core.warning('Skipped ' + item);
